# candidate-web static hosting: SPA fallback + hashed-asset caching.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed assets — safe to cache hard.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
