# ascend-web static hosting: SPA fallback + hashed-asset caching.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed assets — safe to cache hard.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The HTML shell and the service worker must always revalidate: a stale
  # cached index.html references deleted hashed assets (blank-page incident
  # 2026-09-24), and a stale sw.js never re-installs.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
