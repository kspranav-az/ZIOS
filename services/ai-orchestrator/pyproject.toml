[project]
name = "ai-orchestrator"
version = "0.0.0"
description = "AI orchestration service (eval/speech/generation workers) — FastAPI skeleton, Phase 00"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "structlog>=25.1.0",
    "livekit-api>=1.0.0",
    "livekit>=1.0.0",
    "aiohttp>=3.11.0",
    "websockets>=14.0",
    "minio>=7.2.20",
    "python-multipart>=0.0.20",
    "pydantic>=2.13.4",
    "opencv-python-headless>=4.10,<5",
    "mediapipe==0.10.21",
    "numpy>=1.26,<2",
    "librosa>=0.11,<1",
    "soundfile>=0.14.0",
    "onnxruntime>=1.30.0",
    "google-cloud-speech>=2.40.0",
    "pypdf>=5.0.0",
    "piper-tts>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "mediapipe",
    "mediapipe.*",
    "librosa",
    "librosa.*",
    "soundfile",
    "soundfile.*",
    "onnxruntime",
    "onnxruntime.*",
    "piper",
    "piper.*",
    "soxr",
    "soxr.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
