name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build TypeScript packages
        run: pnpm build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f services/api/Dockerfile -t zios-api:ci .

      - name: Build ai-orchestrator image
        run: docker build -f services/ai-orchestrator/Dockerfile -t zios-ai-orchestrator:ci services/ai-orchestrator

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [checks, docker-build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare env
        run: cp .env.example .env

      - name: Start the full stack
        run: docker compose up -d --build --wait

      # The schema now has consumers (ADR-0003): migrate before asserting.
      - name: Run database migrations
        run: pnpm migrate

      - name: Smoke-test health endpoints
        run: |
          curl -fsS http://localhost:3000/healthz | grep '"status":"ok"'
          curl -fsS http://localhost:8000/healthz | grep '"status":"ok"'

      - name: Smoke-test OTP sign-in over Mailpit
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:3000/auth/otp/request \
            -H 'content-type: application/json' \
            -d '{"email":"ci-smoke@example.com"}')
          test "$code" = "200"
          count=0
          for _ in $(seq 1 20); do
            count=$(curl -sS 'http://localhost:8025/api/v1/messages?limit=50' | grep -c 'ci-smoke@example.com' || true)
            [ "$count" -ge 1 ] && break
            sleep 1.5
          done
          echo "mailpit messages for ci-smoke@example.com: $count"
          [ "$count" -ge 1 ]

      - name: Seed the question bank
        run: pnpm seed

      # Phase 02: end-to-end kit authoring loop against the real stack.
      - name: Smoke-test kit publish and immutability
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -X POST http://localhost:3000/auth/otp/request \
            -H 'content-type: application/json' \
            -d '{"email":"ci-kits@example.com"}'
          code=""
          for _ in $(seq 1 20); do
            code=$(curl -sS 'http://localhost:8025/api/v1/messages?limit=50' | python3 -c '
          import json, re, sys, urllib.request
          msgs = json.load(sys.stdin).get("messages", [])
          hit = next((m for m in msgs if any(t["Address"] == "ci-kits@example.com" for t in m["To"])), None)
          if hit:
              detail = json.load(urllib.request.urlopen("http://localhost:8025/api/v1/message/" + hit["ID"]))
              m = re.search(r"(\d{6})", detail.get("Text", ""))
              if m:
                  print(m.group(1))
          ' || true)
            [ -n "$code" ] && break
            sleep 1.5
          done
          echo "otp code retrieved: ${code:+yes}"
          [ -n "$code" ]
          token=$(curl -fsS -X POST http://localhost:3000/auth/otp/verify \
            -H 'content-type: application/json' \
            -d "{\"email\":\"ci-kits@example.com\",\"code\":\"$code\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["session"]["token"])')
          kit=$(curl -fsS -X POST http://localhost:3000/kits \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"title":"CI Smoke Kit","role":"Engineer","level":"mid"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["kit"]["id"])')
          curl -fsS -o /dev/null -X POST "http://localhost:3000/kits/$kit/questions" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"type":"open_ended","prompt":"Tell me about yourself.","rubricLines":[{"id":"r1","text":"Clarity","weight":1}]}'
          curl -fsS -X POST "http://localhost:3000/kits/$kit/publish" \
            -H "authorization: Bearer $token" | grep '"version":1'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "http://localhost:3000/kits/$kit/versions/1" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"title":"tamper"}')
          test "$status" = "409"
          preview_token=$(curl -fsS -X POST "http://localhost:3000/kits/$kit/preview-token" \
            -H "authorization: Bearer $token" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS "http://localhost:3000/preview/$preview_token" \
            -H "authorization: Bearer $token" | grep '"preview":true'

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: Playwright E2E (employer-web)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter employer-web exec playwright install --with-deps chromium

      - name: Prepare env
        run: cp .env.example .env

      - name: Start the full stack
        run: docker compose up -d --build --wait

      - name: Run database migrations
        run: pnpm migrate

      - name: Run E2E suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/employer-web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
